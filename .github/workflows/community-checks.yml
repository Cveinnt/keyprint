name: Community checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=128
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check entry docs, source syntax and exact recorded demo data
        run: python tools/check_community.py
      - name: Check viewer interactions, rendering and traces
        run: node --test --test-concurrency=1 tests/test_gallery_ui.cjs tests/test_playground_ui.cjs tests/test_reader.cjs tests/test_token_explorer.cjs tests/test_wording_diff.cjs tests/test_share_ui.cjs
      - name: Check provider rewrite rejection classification without a model
        run: python -m unittest discover -s tests -p test_provider_contract.py -v
