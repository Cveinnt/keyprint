name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps ./sdk --wheel-dir dist
          python -m pip install dist/*.whl
      - name: Check installed package and fixture behavior
        run: |
          python examples/doctor.py
          python -m unittest discover -s sdk/tests -v
          python examples/compare.py
          python examples/generate_mlx.py --help
