name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps ./sdk --wheel-dir dist
          python -m pip install dist/*.whl
      - name: Check installed package and fixture behavior
        run: |
          python -m unittest discover -s sdk/tests -v
          python -m keyprint_v3.cli doctor
          python -m keyprint_v3.cli demo
  clean-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install clean package
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl 'pytest>=8,<10'
      - name: Check installed package and reference parity
        run: |
          python -m pip check
          keyprint doctor
          keyprint demo
          python -m pytest
  transformers-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install CPU inference and build the SDK wheel
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(find dist -name '*.whl')[test,transformers,server,clients,structured]"
      - run: python -m pytest tests/test_transformers.py tests/test_transformers_utf8.py tests/test_native_sampler.py tests/test_structured.py tests/test_bytelevel.py
      - name: Download the pinned public inference fixture
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('HuggingFaceTB/SmolLM2-135M-Instruct',
              revision='12fd25f77366fa6b3b4b768ec3050bf629380bac', local_dir='model-fixture',
              allow_patterns=['*.json', '*.safetensors', '*.txt', '*.jinja'])
          PY
      - name: Real inference, text comparisons and SDK-over-HTTP checks
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python tools/validate_compatibility.py --backend transformers --model model-fixture --output inference-results --http-client
      - name: Replay real ordinary and marked token caps inside UTF-8 characters
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python tools/validate_portable_utf8.py --model model-fixture --condition ordinary --output utf8-ordinary-results
          python tools/validate_portable_utf8.py --model model-fixture --condition marked --output utf8-marked-results
      - name: Real inference after client timeout, conflict and busy requests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python tools/validate_server_lifecycle.py --model model-fixture --output lifecycle-results
      - name: Cancel actual inference and reuse the worker without replaying the cancelled attempt
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python tools/validate_cancellation.py --backend transformers --model model-fixture --output cancellation-results
      - name: Cancel actual inference through the Anthropic client and reuse the worker
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python tools/validate_cancellation.py --backend transformers --protocol anthropic --model model-fixture --output messages-cancellation-results
      - name: Retain synthetic texts and comparison results, never keys or journals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-inference-comparisons
          path: |
            inference-results/public/
            lifecycle-results/public/
            cancellation-results/public/
            messages-cancellation-results/public/
            utf8-ordinary-results/public/
            utf8-marked-results/public/
          if-no-files-found: warn
          retention-days: 14
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test,server,clients]'
      - run: python -m pip check
      - run: python -m pytest tests/test_server.py tests/test_messages_server.py tests/test_rewrite.py tests/test_playground.py tests/test_inspection.py tests/test_capped_utf8.py
      - name: Check safe response rendering and playground measurement state
        run: node --test tests/test_reader.cjs tests/test_playground_ui.cjs
