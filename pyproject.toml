[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyprint"
version = "0.1.0a1"
description = "Inspectable text watermarking with explicit model bindings and evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "sdk/THIRD_PARTY_NOTICES.md", "sdk/licenses/*.txt"]
authors = [{name = "Vincent Wu (Cveinnt)"}]
dependencies = ["numpy==2.5.2", "scipy==1.17.1", "tokenizers==0.23.1"]

[project.optional-dependencies]
server = ["fastapi==0.141.1", "uvicorn==0.53.0"]
clients = ["openai==3.14.1", "anthropic==1.6.0"]
transformers = ["torch>=2.6,<3", "transformers==5.16.1"]
mlx = ["mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'", "transformers==5.16.1"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://keyprint.vercel.app/"
Documentation = "https://github.com/Cveinnt/keyprint#readme"
Repository = "https://github.com/Cveinnt/keyprint"
Issues = "https://github.com/Cveinnt/keyprint/issues"

[project.scripts]
keyprint = "keyprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyprint = ["py.typed", "_engine/**/*.json", "_engine/**/*.md", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
